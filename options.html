<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prompt Extractor Options</title>
  <style>
    :root { color-scheme: light; --ink: #17242b; --muted: #647983; --line: #d3e1e7; --panel: #fff; --canvas: #fff; --field: #f2f9fc; --accent: #1769d1; --accent-dark: #1254a8; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 48px 20px; color: var(--ink); background: var(--canvas); font: 14px/1.5 Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .card { width: min(100%, 560px); margin: 0 auto; padding: 28px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); box-shadow: 0 18px 46px rgba(33,72,84,.10); }
    h1 { margin: 0; font-size: 22px; } .subtitle { margin: 5px 0 26px; color: var(--muted); font-size: 12px; }
    label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 12px; font-weight: 750; letter-spacing: .04em; text-transform: uppercase; }
    input { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; outline: 0; background: var(--field); color: var(--ink); font: inherit; }
    input:focus { border-color: #83c4ce; box-shadow: 0 0 0 3px rgba(22,125,138,.12); }
    .hint { margin: 8px 0 22px; color: var(--muted); font-size: 12px; }
    button { min-height: 36px; padding: 0 16px; border: 0; border-radius: 9px; background: var(--accent); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: var(--accent-dark); }
    #status { min-height: 20px; margin-top: 12px; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Prompt Extractor</h1>
    <p class="subtitle">Made by Digital Ego One</p>
    <label for="allowedDomains">Allowed image domains</label>
    <input type="text" id="allowedDomains" placeholder="example.com, anotherdomain.com">
    <p class="hint">Leave empty to allow images from any domain.</p>
    <button id="saveButton">Save settings</button>
    <div id="status" role="status" aria-live="polite"></div>
  </main>
  <script src="options.js"></script>
</body>
</html>
