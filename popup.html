<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prompt Extractor</title>
  <style>
    :root { color-scheme: light; --ink: #17242b; --muted: #647983; --soft-muted: #8aa0a9; --line: #d3e1e7; --panel: #fff; --canvas: #fff; --field: #f2f9fc; --accent: #167d8a; --accent-dark: #0d6370; --accent-soft: #dff2f6; }
    * { box-sizing: border-box; }
    body { width: 368px; margin: 0; color: var(--ink); background: var(--canvas); font: 13px/1.45 Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button { font: inherit; }
    .popup { overflow: hidden; border: 1px solid rgba(176,191,182,.65); border-radius: 16px; background: var(--panel); box-shadow: 0 18px 46px rgba(24,44,35,.12), 0 2px 8px rgba(24,44,35,.06); }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 18px 18px 14px; }
    .brand { display: flex; min-width: 0; align-items: center; gap: 10px; }
    .brand-mark { display: grid; width: 32px; height: 32px; flex: 0 0 auto; place-items: center; }
    .brand-mark img { width: 29px; height: 29px; object-fit: contain; }
    .brand-title { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
    .brand-subtitle { margin: 1px 0 0; color: var(--muted); font-size: 11px; }
    .source { display: inline-flex; align-items: center; max-width: 116px; gap: 6px; padding: 6px 8px; overflow: hidden; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 10px; font-weight: 650; white-space: nowrap; }
    .source.is-available { border-color: #b9dccb; background: #f0faf5; color: var(--accent-dark); }
    .source.is-unavailable { border-color: #ead7a9; background: #fffaf0; color: #8b6a20; }
    .source-dot { width: 6px; height: 6px; flex: 0 0 auto; border-radius: 50%; background: #d6a52e; }
    .source.is-available .source-dot { background: #2f9b68; }
    .topbar-actions { display: flex; align-items: center; gap: 6px; }
    .icon-button { display: inline-grid; width: 30px; height: 30px; place-items: center; padding: 0; border: 0; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; }
    .icon-button:hover, .icon-button:focus-visible { background: var(--field); color: var(--ink); outline: none; }
    .content { padding: 0 18px 18px; }
    .section { padding-top: 16px; border-top: 1px solid var(--line); }
    .section + .section { margin-top: 16px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 9px; }
    .section-title { display: flex; align-items: center; gap: 7px; margin: 0; color: #5d6b64; font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .section-title svg { color: var(--accent); }
    .count { color: var(--soft-muted); font-size: 10px; font-weight: 600; }
    .prompt-box { overflow: hidden; border: 1px solid var(--line); border-radius: 11px; background: var(--field); }
    .prompt-box:focus-within { border-color: #92c5b0; box-shadow: 0 0 0 3px rgba(22,125,91,.10); }
    .content-field { display: block; width: 100%; min-height: 168px; max-height: 220px; overflow: auto; padding: 12px; white-space: pre-wrap; overflow-wrap: anywhere; background: transparent; color: var(--ink); font-size: 13px; line-height: 1.48; }
    .compact-field { min-height: 48px; max-height: 150px; }
    .prompt-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 9px 8px; border-top: 1px solid var(--line); color: var(--soft-muted); font-size: 10px; }
    .copy-button, .small-copy { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border-radius: 9px; cursor: pointer; font-weight: 700; }
    .copy-button { min-height: 34px; margin-top: 10px; padding: 0 12px; border: 0; background: var(--accent); color: #fff; font-size: 12px; }
    .copy-button:hover { background: var(--accent-dark); }
    .copy-button.is-copied { background: #278d6c; }
    .empty-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--field); color: var(--muted); font-size: 12px; }
    .empty-copy { display: flex; align-items: center; gap: 8px; }
    .empty-icon { display: grid; width: 22px; height: 22px; flex: 0 0 auto; place-items: center; border-radius: 7px; background: #e8efeb; color: var(--soft-muted); }
    .small-copy { padding: 6px 8px; border: 1px solid #cbd6d0; background: #fff; color: var(--muted); font-size: 10px; }
    .small-copy:hover { border-color: #9eb5a7; color: var(--accent-dark); }
    #toast { position: fixed; right: 12px; bottom: 12px; padding: 8px 12px; border-radius: 8px; color: white; background: #1d2522; opacity: 0; transform: translateY(6px); transition: opacity .18s, transform .18s; pointer-events: none; }
    #toast.visible { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <main class="popup" aria-label="Prompt Extractor">
    <header class="topbar">
      <div class="brand"><div class="brand-mark" aria-hidden="true"><img src="icons/icon128.png" alt=""></div><div><h1 class="brand-title">Prompt Extractor</h1><p class="brand-subtitle">Made by Digital Ego One</p></div></div>
      <div class="topbar-actions"><div class="source is-unavailable" id="source" title="CivitAI availability"><span class="source-dot"></span><span id="sourceLabel">Unavailable</span></div><button class="icon-button" id="optionsButton" aria-label="Open options" title="Options">⋯</button></div>
    </header>
    <div class="content">
      <section class="section"><div class="section-head"><h2 class="section-title">✓ Positive prompt</h2><span class="count" id="count">0 chars</span></div><div class="prompt-box"><div id="prompt" class="content-field" tabindex="0">Positive prompt not found.</div><div class="prompt-footer"><span>Extracted text</span><button class="icon-button" id="copyPromptIcon" aria-label="Copy positive prompt" title="Copy positive prompt"></button></div></div><button class="copy-button" id="copyPromptButton"><span>Copy positive prompt</span></button></section>
      <section class="section"><div class="section-head"><h2 class="section-title">× Negative prompt</h2></div><div class="prompt-box"><div id="negativePrompt" class="content-field compact-field" tabindex="0">Negative prompt not found.</div><div class="prompt-footer"><span>Extracted text</span></div></div><button class="copy-button" id="copyNegativePromptButton"><span>Copy negative prompt</span></button></section>
      <section class="section"><div class="section-head"><h2 class="section-title">≡ Technical metadata</h2></div><div class="prompt-box"><div id="otherMetadata" class="content-field compact-field" tabindex="0">Technical metadata not found.</div><div class="prompt-footer"><span>Extracted metadata</span></div></div><button class="copy-button" id="copyMetadataButton"><span>Copy technical metadata</span></button></section>
    </div>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="popup.js"></script>
</body>
</html>
